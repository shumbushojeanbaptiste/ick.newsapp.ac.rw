name: Templary Deploy PHP Files to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e
            cd /home/staystore-magazine/htdocs/magazine.staystore.online

            # Fetch, then hard-reset to the remote so a plain "git pull" can never
            # fail on locally-modified tracked files (the usual cause of a failed
            # deploy). This ONLY touches tracked files — untracked files such as
            # Admin/uploads/ (gitignored) are left untouched. We do NOT run
            # "git clean", so no uploaded content is ever deleted.
            git fetch origin main
            git reset --hard origin/main